version: '3.9'

services:
  postgres:
    image: 'postgres:18'
    container_name: spring-database
    restart: unless-stopped
    # env_file: ./hh_psuti.env     в .gitignore
    environment:
      POSTGRES_DB: hh_psuti
      POSTGRES_PASSWORD: 1
      POSTGRES_USER: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - '5433:5432'
healthcheck:
  test: ["CMD-SHELL", "pg_isready -U postgres -d hh_psuti || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 5