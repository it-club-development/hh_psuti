spring:
  application:
    name: backend

  config:
    import: optional:file:.env[.properties]

  # ===== БАЗА ДАННЫХ =====
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydatabase}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===== JPA / HIBERNATE =====
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  # ===== REDIS (кэширование) =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ===== DOCKER COMPOSE =====
  docker:
    compose:
      enabled: false

  # ===== DEVTOOLS =====
  devtools:
    add-properties: false

  # ===== ПРОФИЛИ =====
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}      # 15 минут
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 дней

# ===== 1С ИНТЕГРАЦИЯ =====
#integration:
#  one-c:
#    base-url: ${ONE_C_URL:http://localhost:8081/api}
#    timeout: ${ONE_C_TIMEOUT:5000}
#    retry:
#     attempts: 3
#      delay: 1000

# ===== СЕРВЕР =====
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SERVER_SECURE:false}
        same-site: lax
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 20000

# ===== ЛОГИРОВАНИЕ =====
logging:
  level:
    com.example.demo: ${LOG_LEVEL:DEBUG}
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: WARN
    org.springframework.data.redis: WARN
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30