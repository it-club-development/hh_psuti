
spring:
  application:
    name: backend

  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/hh_psuti?sslmode=disable
    username: postgres
    password: 1
      ###   Из окружения
    #url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:newsdb}
      #username: ${DB_USER:your_username}
      #password: ${DB_PASSWORD:your_password}
    hikari:
      ###   Какая нам нагрузка нужна?
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: HikariCP

  jpa:
    hibernate:
      ddl-auto: update #Эту штуку потом лучше заменить на validate или на миграции
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

threads:
  virtual:
    enabled: true

  server:
    port: 8080
    servlet:
      session:
        cookie:
          http-only: true
          secure: true
          same-site: lax

  logging:
    level:
      root: INFO
      com.example.demo: DEBUG
      org.springframework.web: DEBUG
      org.hibernate.SQL: DEBUG
    file:
      name: logs/hh_logs.log
