
spring:
  application:
    name: backend

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase?sslmode=disable
    username: myuser
    password: secret

  server:
    port: 8080
    servlet:
      session:
        cookie:
          http-only: true
          secure: false
          same-site: lax

  logging:
    level:
      com.example.demo: DEBUG
      org.springframework.web: DEBUG
# ===== JWT =====
jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
  access-expiration: 900000   # 15 минут
  refresh-expiration: 2592000000  # 30 дней

# ===== 1С ИНТЕГРАЦИЯ =====
integration:
  one-c:
    base-url: ${ONE_C_URL:http://localhost:8081/api}
    timeout: 5000
    retry:
      attempts: 3
      delay: 1000

server:
  port: 8080

logging:
  level:
    com.example.demo: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: WARN
    org.springframework.data.redis: WARN