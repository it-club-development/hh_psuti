spring:
  # ===== БАЗА ДАННЫХ (PostgreSQL) =====
  datasource:
    url: jdbc:postgresql://localhost:5432/hh_psuti
    username: postgres
    password: 1
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  # ===== JPA / HIBERNATE =====
  jpa:
    hibernate:
      ddl-auto: create-drop  # Создаёт и удаляет таблицы для тестов
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  # ===== DOCKER COMPOSE =====
  docker:
    compose:
      enabled: false

  # ===== DEVTOOLS =====
  devtools:
    add-properties: false

# ===== JWT =====
jwt:
  secret: testSecretKey123456789012345678901234567890
  access-expiration: 900000
  refresh-expiration: 2592000000

# ===== ЛОГИРОВАНИЕ =====
logging:
  level:
    org.springframework: INFO
    org.hibernate: WARN
    com.example.demo: DEBUG
    org.springframework.jdbc: DEBUG